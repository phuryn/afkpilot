name: CI

# This repo had no CI until 2026-08-15. Everything here ran only when a person
# remembered to run it, which is how `e2e:repo-switch` sat red for ten days
# before anyone noticed. `npm run gate` is the release gate; this makes it run
# on its own.
on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Every e2e script here drives a real Chromium through Playwright —
      # browser-e2e, touch-ui-check, legacy-host-check, tab-identity-check,
      # desktop-downloads-check and ui-screens-check. Headless, so no xvfb.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # `gate:ci` is `gate` MINUS `e2e:browser`. Not a convenience trim: the
      # browser suite drives the real Clerk sign-in modal and needs the dev
      # Clerk + Supabase keys, and its own header says that without a .env the
      # relay runs mock mode and "this script will fail its Clerk check". No
      # secrets are configured here, so running it would land red on every
      # push. Every other suite deliberately BLANKS the credentials to force
      # keyless mode, so they are hermetic by design.
      #
      # What that costs: the authenticated mile — ClerkJS hot-load, the
      # sign-in modal, the __session cookie on the WS upgrade, link approval
      # and revocation — is NOT covered here. `npm run gate` locally still
      # covers it, and stays mandatory before promoting to production. To close
      # the gap, add the dev Clerk/Supabase keys as repository secrets and
      # switch this step to `npm run gate` (maintainer's call — it puts dev
      # credentials in CI).
      #
      # `check:vendor` (chained by `npm test`) authenticates web/vendor against
      # its committed hash manifest, so it works from a bare clone with no
      # sibling extension checkout.
      - name: npm run gate:ci
        run: npm run gate:ci

      # The screenshot gate writes frames a human (or a model) can look at when
      # something fails. Kept only on failure; .screens/ is gitignored locally.
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: .screens/
          if-no-files-found: ignore
          retention-days: 7

  # DRAFT for review — real relay + real Chromium + the sibling's real desktop
  # host, including a host restart. This cannot live in the `gate` job above:
  # that job is a bare clone of THIS repo only, and a loud skip there would
  # look like coverage while testing nothing (the e2e:repo-switch rot).
  #
  # Both repositories are public. This job needs NO secrets. That is the
  # opposite of `e2e:browser`, which is excluded from gate:ci precisely
  # because it needs Clerk + Supabase credentials. This suite blanks those
  # (keyless mock mode) and talks only to 127.0.0.1.
  #
  # Linux host boot has precedent in phuryn/grok-build-vscode: its integration
  # job is `xvfb-run -a npm run test:integration` on ubuntu-latest.
  #
  # Release-order: this job checks out the sibling's DEFAULT BRANCH tip, not
  # a SHA. Same rule as relay-before-extension: it cannot pass until the
  # host-side contract the suite depends on is on that branch (unique fake
  # session ids + stdin shutdown, sibling commit 357a300). A local sibling
  # checkout can run against an unpushed commit; CI cannot.
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out sibling host repo
        uses: actions/checkout@v4
        with:
          repository: phuryn/grok-build-vscode
          path: grok-build-vscode
          # Default branch tip. Do not pin a SHA that is not on that branch
          # yet — the job stays red until 357a300 (or its successor) is pushed.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install sibling (Electron + compile)
        working-directory: grok-build-vscode
        run: npm ci && npm run compile
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: npm run e2e:lifecycle
        run: xvfb-run -a npm run e2e:lifecycle
        env:
          GROK_BUILD_VSCODE: ${{ github.workspace }}/grok-build-vscode
          LIFECYCLE_REQUIRE_HOST: "1"
      - name: Upload lifecycle artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle
          path: e2e-artifacts/lifecycle/
          if-no-files-found: ignore
          retention-days: 7
