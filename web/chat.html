<!DOCTYPE html>
<html lang="en">
<!--
  The remote chat client = the extension's webview UI (vendored chat.js/chat.css,
  run `npm run sync-ui`) behind an acquireVsCodeApi -> WebSocket shim.
  Body structure mirrors getHtml() in grok-build-vscode/src/sidebar.ts — if that
  page gains/renames an element chat.js needs, update this copy too.
-->
<head>
<meta charset="UTF-8" />
<!-- No viewport-fit=cover: on edge-to-edge Android it extends the layout
     under the system nav bar while env(safe-area-inset-bottom) stays 0,
     cropping the composer's toolbar row. Without it every browser keeps the
     viewport clear of system bars on its own. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
  (function () {
    var root = document.documentElement;
    var saved;
    try { saved = localStorage.getItem("grok-remote-theme"); } catch (e) {}
    var initial = saved || ((window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark");
    root.setAttribute("data-theme", initial);
    // The vendored chat.css keys its light-mode diff colors off VS Code's own
    // body class (body.vscode-light) — mirror data-theme onto it. body doesn't
    // exist yet in this head script, so sync on DOMContentLoaded too.
    function syncBodyTheme() {
      if (document.body) document.body.classList.toggle("vscode-light", root.getAttribute("data-theme") === "light");
    }
    document.addEventListener("DOMContentLoaded", syncBodyTheme);
    window.__toggleTheme = function () {
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("grok-remote-theme", next); } catch (e) {}
      syncBodyTheme();
    };
  })();
</script>
<title>AFK Pilot — chat</title>
<meta name="description" content="AFK Pilot chat client — drive your Grok Build for VS Code (Community) agent from the browser." />
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.svg" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
:root {
  color-scheme: dark;
  /* The site's --font-sans, not VS Code's shorter stack — one family across
     the product (visible mainly on desktops with Inter; Android resolves to
     Roboto either way). */
  --vscode-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
  --vscode-editor-font-family: "SF Mono", Menlo, Consolas, monospace;
  /* Prose ink: near-white (not #fff — halation on OLED), brighter than VS
     Code's #cccccc — this is a reading surface, not a side panel. Secondary
     chrome (tool rows, timestamps) keeps descriptionForeground gray, which
     sharpens the prose/chrome hierarchy. */
  --vscode-foreground: #e6e6e6;
  --vscode-descriptionForeground: #9d9d9d;
  --vscode-editor-background: #1e1e1e;
  --vscode-sideBar-background: #1e1e1e;
  --vscode-editorWidget-background: #252526;
  --vscode-editorWidget-border: #454545;
  --vscode-widget-border: #454545;
  --vscode-panel-border: #2b2b2b;
  --vscode-focusBorder: #007fd4;
  --vscode-button-background: #0e639c;
  --vscode-button-foreground: #ffffff;
  --vscode-button-hoverBackground: #1177bb;
  /* Dark Modern's input surface. Dark+'s #3c3c3c sat well above the editor
     background and made the composer read as a raised panel rather than a
     field, which is the difference visible against VS Code side by side. */
  --vscode-input-background: #313131;
  /* Typed text carries the same ink as the prose it becomes. */
  --vscode-input-foreground: #e6e6e6;
  --vscode-input-border: #3c3c3c;
  --vscode-textLink-foreground: #3794ff;
  --vscode-textCodeBlock-background: #0a0a0a;
  --vscode-list-hoverBackground: #2a2d2e;
  /* The vendored CSS marks the current session/repo/mode with
     --vscode-list-activeSelection*, which in VS Code comes from the user's real
     theme. Here the shim IS the theme, and it carried legacy Dark+ (#094771) —
     a saturated blue that read as "button", not "current". VS Code's neutral
     selection grey is what an editor actually shows for this, so use it rather
     than the Dark Modern accent (#04395e): the marker should recede.
     activeSelectionForeground is set explicitly per theme — the vendored rules
     fall back to --vscode-foreground, which is fine on dark but would put pale
     ink on the light-theme grey. */
  --vscode-list-activeSelectionBackground: #37373d;
  --vscode-list-activeSelectionForeground: #ffffff;
  --vscode-list-inactiveSelectionBackground: #37373d;
  --vscode-toolbar-hoverBackground: #383b3d;
  --vscode-badge-background: #4d4d4d;
  --vscode-badge-foreground: #ffffff;
  --vscode-errorForeground: #f48771;
  --vscode-charts-green: #4ec9b0;
  --vscode-charts-blue: #3794ff;
  --vscode-charts-yellow: #d7ba7d;
  --vscode-charts-red: #f48771;
  /* The vendored scrollbar styles key off these — undefined = an invisible
     thumb, so desktop showed no scrollbar. */
  --vscode-scrollbarSlider-background: rgba(121,121,121,0.4);
  --vscode-scrollbarSlider-hoverBackground: rgba(100,100,100,0.7);
  --vscode-scrollbarSlider-activeBackground: rgba(191,191,191,0.5);
}
:root[data-theme="light"] {
  color-scheme: light;
  --vscode-foreground: #3b3b3b;
  --vscode-descriptionForeground: #6e6e6e;
  --vscode-editor-background: #ffffff;
  --vscode-sideBar-background: #ffffff;
  --vscode-editorWidget-background: #f8f8f8;
  --vscode-editorWidget-border: #d4d4d4;
  --vscode-widget-border: #d4d4d4;
  --vscode-panel-border: #e5e5e5;
  --vscode-focusBorder: #005fb8;
  --vscode-button-background: #005fb8;
  --vscode-button-foreground: #ffffff;
  --vscode-button-hoverBackground: #0258a8;
  --vscode-input-background: #ffffff;
  --vscode-input-foreground: #3b3b3b;
  --vscode-input-border: #cecece;
  --vscode-textLink-foreground: #005fb8;
  --vscode-textCodeBlock-background: #f6f6f6;
  --vscode-list-hoverBackground: #f2f2f2;
  --vscode-list-activeSelectionBackground: #e4e6f1;
  --vscode-list-activeSelectionForeground: #3b3b3b;
  --vscode-list-inactiveSelectionBackground: #e4e6f1;
  --vscode-toolbar-hoverBackground: #e5e5e5;
  --vscode-badge-background: #cccccc;
  --vscode-badge-foreground: #333333;
  --vscode-errorForeground: #cd3131;
  --vscode-charts-green: #388a34;
  --vscode-charts-blue: #1a85ff;
  --vscode-charts-yellow: #bf8803;
  --vscode-charts-red: #cd3131;
  --vscode-scrollbarSlider-background: rgba(100,100,100,0.35);
  --vscode-scrollbarSlider-hoverBackground: rgba(100,100,100,0.55);
  --vscode-scrollbarSlider-activeBackground: rgba(0,0,0,0.6);
}
html { background: #1a1a1a; }
:root[data-theme="light"] { background: #fbfbfc; }
html, body { margin: 0; color: var(--vscode-foreground); font-family: var(--vscode-font-family); }
/* Bulletproof app shell: the DOCUMENT must never scroll. Mobile Chrome
   scrolls the ROOT to reveal a focused input, which walked the whole page —
   top bar included — out of view, and stale keyboard heights left the
   composer cropped. Pinning body to the viewport (fixed inset:0 tracks the
   layout viewport, keyboard resizes included) makes #messages the ONLY
   scroller; the header and composer physically cannot leave the screen. */
html { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  position: fixed;
  inset: 0;
  overflow: hidden;
  overscroll-behavior: none;
}
@media (max-width: 899px) {
  .composer { padding-bottom: max(6px, env(safe-area-inset-bottom)); }
}
html body { background: #1a1a1a; }
:root[data-theme="light"] body { background: #fbfbfc; }
/* Desktop browsers: the vendored UI was drawn for a sidebar — cap and center
   the app column so a full-screen tab stays readable. 1120px = the site's
   --wrap, so /chat aligns with every other page; hairline borders define the
   column when the viewport is wider. (The VS Code webview never loads this
   file.) */
body { width: 100%; }
#app {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  background: var(--vscode-sideBar-background);
}
/* Author `display:flex` would otherwise beat the UA [hidden] rule and leave
   the chat UI painted under the update-your-extension notice. */
#app[hidden] { display: none; }
/* Both wrappers dissolve on phones, so the markup keeps the original
   single-column flow: header, messages, composer. The rail is not a column
   here — it is a drawer, and `position: fixed` takes it out of this flow
   entirely, so `display: contents` on the wrappers costs it nothing. */
#app-body,
#chat-main-row,
#chat-stack,
#chat-column { display: contents; }
/* The file panel's dock. Narrow viewports have no third column to give it, so
   it is absent here and the panel mounts as an overlay — see the @media block
   below for the docked case. */
#file-panel-dock { display: none; }
/* `body #projects-rail` (1-0-1), not the bare id, ON PURPOSE. This <style>
   block is loaded BEFORE the vendored chat.css, so every rail declaration they
   share at equal specificity is won by the vendored file — and chat.css styles
   the DOCKED rail. That is not theoretical: the drawer shipped to production
   398px wide on paper and 149px on a real phone, because chat.css's
   `width: min(260px, 38vw)` quietly took over. Anything here that contradicts
   a docked-rail rule needs the extra specificity for the same reason. */
body #projects-rail {
  position: fixed;
  z-index: 40;
  inset-block: 0;
  left: 0;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  width: min(86vw, 330px);
  color: var(--vscode-foreground);
  background: var(--vscode-sideBar-background);
  border-right: 1px solid var(--vscode-panel-border);
  /* Off-canvas by default. `visibility` rides with it so a closed drawer is
     also out of the tab order — a hidden panel that still takes focus is how a
     keyboard ends up somewhere the eye cannot follow. */
  visibility: hidden;
  transform: translateX(-100%);
  transition: transform .18s ease, visibility 0s linear .18s;
}
body.rail-open #projects-rail {
  visibility: visible;
  transform: none;
  transition: transform .18s ease, visibility 0s;
  box-shadow: 0 0 40px rgba(0,0,0,.45);
}
@media (prefers-reduced-motion: reduce) {
  #projects-rail { transition: none; }
}
/* A drag handle is for a rail with a visible edge. The drawer is off-canvas
   and slides over the conversation, so there is no edge to pull — and a phone
   has no hover to reveal what the handle would do. Beats chat.css's
   `body.has-rail .rail-resizer` (0-2-1) on specificity, since source order
   would go the other way. */
body.has-rail #rail-resizer { display: none; }
#rail-scrim {
  position: fixed;
  inset: 0;
  z-index: 39;
  background: rgba(0,0,0,.5);
}
#rail-scrim[hidden] { display: none; }

/* Where the rail exists, it IS the app chrome: the project controls moved into
   it, and what remains belongs to the conversation, so the app-wide bar goes.
   Without a rail (an extension too old to send `repos`) nothing else can carry
   New/History, so the bar stays exactly as it was — capability, not version. */
body.has-rail .top-bar { display: none; }
#session-head { display: none; }
body.has-rail #session-head {
  display: flex;
  align-items: center;
  flex: none;
  /* Anchor and stacking context for the history dropdown, which is reparented
     here (see the shim) and positions itself against its offset parent. */
  position: relative;
  z-index: 3;
  gap: 2px;
  box-sizing: border-box;
  min-height: 46px;
  padding: 3px 6px;
  background: var(--vscode-sideBar-background);
  border-bottom: 1px solid var(--vscode-panel-border);
}
/* A label, not a control: it says which conversation you are reading and which
   project it is in, and nothing is hidden behind it. History and New are their
   own icons to its right, the same two controls the VS Code top bar has. */
#session-head-main {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  flex: 1 1 auto;
  min-width: 0;
  gap: 1px;
  padding: 4px 8px;
  color: var(--vscode-foreground);
}
#session-head-titlerow {
  display: flex;
  align-items: center;
  gap: 2px;
  max-width: 100%;
  min-width: 0;
}
/* #session-head-main is a column with align-items:flex-start, so this row is
   sized by its content — which made the edit field NARROWER than the name it
   replaced, because `width: 100%` on the input resolved against a row that had
   already shrunk to the input's own default width. Stretching the row fixes
   that, but on a wide header it overshot into a full-width field for a short
   name; the cap keeps it a field rather than a banner, and on a narrow screen
   the stretch is what applies. */
#session-head-titlerow:has(.session-name-input) {
  align-self: stretch;
  max-width: 300px;
}
#session-head-title,
#session-head-sub {
  display: block;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#session-head-title { font-size: 15px; font-weight: 600; line-height: 1.4; }
/* The name is the header's headline here, not the quiet 12px chip the VS Code
   top bar wants — so the shared label styling is overridden back to this
   header's own type. `min-width: 0` keeps the ellipsis working inside the row. */
#session-head-title.session-name-label {
  min-width: 0;
  padding: 0;
  border: 0;
  color: inherit;
  font-size: 15px;
  font-weight: 600;
  background: transparent;
}
#session-head-title.session-name-label:hover { color: inherit; text-decoration: underline; }
/* Exception: the rename pencil is an inline title adornment — glyph 16, not
   the 20px bar-icon primitive — but it still uses color-hover / no-box. */
#session-head-edit {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  padding: 0;
  border: 0;
  background: transparent;
}
#session-head-edit:hover { color: var(--vscode-foreground); background: transparent; }
#session-head-edit svg { width: 16px; height: 16px; }
/* Touch floor for the two controls this page owns by id, so they cannot be
   reached by the shared rule in chat.css. The pencil was 22x22 — under the
   WCAG 2.5.8 AA minimum — and the title it sits beside was 21px tall, which is
   the whole tap area for "rename this conversation". Coarse pointers only; a
   mouse keeps the compact header. See the note at the end of chat.css. */
@media (hover: none) and (pointer: coarse) {
  #session-head-edit { min-width: 36px; min-height: 36px; }
  #session-head-edit svg { width: 16px; height: 16px; }
  #session-head-title.session-name-label { min-height: 36px; display: flex; align-items: center; }
}
/* Editing in place must not resize the header, so the input takes the row it
   replaces rather than the full width of the column. */
#session-head-titlerow .session-name-input {
  font-size: 15px;
  font-weight: 600;
  width: 100%;
}
/* The repo line is what the mobile repo chip used to say, and it says more: the
   chip named the project, this names the conversation AND the project. */
#session-head-sub { font-size: 11px; color: var(--vscode-descriptionForeground); line-height: 1.45; }
#session-head-sub:empty, #session-head-sub[hidden] { display: none; }
#session-head-actions { display: flex; flex: 0 0 auto; }
/* chat.css gives the ⋯ slot a trailing divider to separate it from the desktop
   app's panel toggles. This page has no panel toggles — the ⋯ is the last
   control in the header — so the divider ends the bar against nothing. Scoped
   to #session-head (which only this page has) rather than fought with
   :last-child: the history popover is reparented in here at runtime, so the
   slot is not structurally last even though it is visually last. */
#session-head #session-head-actions { margin-right: 0; padding-right: 0; border-right: 0; }
#rail-open, #session-history, #session-new { flex: 0 0 auto; }
/* One reading measure for the prose and the control that produces it. Wide
   blocks — diffs, terminal output, tables — keep their own horizontal scroll
   inside it rather than widening the column. On a phone the max() collapses to
   the vendored padding, so this rule costs nothing there. */
body.has-rail #messages,
body.has-rail .composer,
body.has-rail #quota-wall,
body.has-rail #reconnecting-indicator { padding-inline: max(10px, calc((100% - 800px) / 2)); }

@media (min-width: 1152px) {
  /* The side borders framed a centred column. Full bleed has no column to frame
     — they would just be hairlines drawn on the window edges. */
  #app { border-inline: 1px solid var(--vscode-panel-border); }
  body.has-rail #app { border-inline: 0; }
}
.welcome { visibility: hidden; }
.auth-overlay { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; background: rgba(20,20,20,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
:root[data-theme="light"] .auth-overlay { background: rgba(0,0,0,.35); }
.auth-overlay[hidden] { display: none; }
.auth-overlay .panel {
  background: var(--vscode-editorWidget-background);
  border: 1px solid var(--vscode-editorWidget-border);
  border-radius: 14px;
  box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 28px 64px rgba(0,0,0,.55);
  padding: 30px 34px;
  width: min(380px, 100%);
  text-align: center;
  font-size: 14px;
  line-height: 1.55;
  color: var(--vscode-foreground);
}
.auth-overlay .panel::before {
  content: "";
  display: block;
  width: 30px; height: 30px;
  margin: 0 auto 16px;
  background-color: var(--vscode-foreground);
  -webkit-mask: url(/logo.svg) center / contain no-repeat;
  mask: url(/logo.svg) center / contain no-repeat;
}
.auth-overlay .panel p { margin: 0 0 4px; }
.auth-overlay .muted { color: var(--vscode-descriptionForeground); font-size: 13px; }
.auth-overlay a { color: var(--vscode-textLink-foreground); }
.auth-overlay button {
  margin-top: 18px;
  padding: 10px 26px;
  font-size: 15px;
  font-family: inherit;
  background: var(--vscode-button-background);
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--vscode-button-foreground);
  cursor: pointer;
  transition: background .15s ease;
}
.auth-overlay button:hover { background: var(--vscode-button-hoverBackground); }
.auth-overlay button:focus-visible { outline: 2px solid var(--vscode-focusBorder); outline-offset: 2px; }
.auth-overlay button.quiet { background: transparent; border-color: var(--vscode-editorWidget-border); color: var(--vscode-foreground); }
.auth-overlay button.quiet:hover { background: var(--vscode-toolbar-hoverBackground); }
.auth-overlay .actions { display: flex; gap: 10px; justify-content: center; }
/* Remote-only chrome: the AFK Pilot brand in the top bar (the extension's own
   webview has no such element — this file adds it around the vendored UI). */
.top-bar .afk-brand {
  margin-right: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 6px;
  height: 28px;
  color: var(--vscode-descriptionForeground);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-decoration: none;
  border-radius: 4px;
}
/* Brand is a wordmark, not a button — match the home page: no color/bg/
   underline shift on hover, on either the mobile chip or the desktop header. */
.top-bar .afk-brand:hover { text-decoration: none; }
.site-brand:hover { color: var(--sb-heading); text-decoration: none; }
.afk-brand .mark {
  width: 15px; height: 15px; flex: none;
  background-color: currentColor;
  -webkit-mask: url(/logo.svg) center / contain no-repeat;
  mask: url(/logo.svg) center / contain no-repeat;
}
@media (max-width: 899px) {
  /* Match the brand chip to the header scale: the mark was 15px next to the
     20px header icons, the wordmark 12px next to 16px prose — both read small.
     Chip height grows to keep them vertically centered. */
  .top-bar .afk-brand { font-size: 15px; height: 36px; }
  .afk-brand .mark { width: 20px; height: 20px; }
  /* The repo chip and the brand both want the left of .top-bar, and both ship
     `margin-right: auto` — two auto gaps would split the free space and strand
     the chip mid-bar. The chip wins the slot: which repo you're driving is
     state you cannot infer from anywhere else on the page, whereas the
     wordmark repeats on every other page and the mark alone still carries the
     brand (and the link home). Desktop is unaffected — there .afk-brand is
     display:none and the brand lives in #site-bar. */
  .top-bar .afk-brand { margin-right: 0; }
  /* ...but the chip only exists once the HOST advertises `repos`. Against an
     older extension it stays [hidden], and then nothing carries the auto gap:
     .top-bar is justify-content:flex-end, so the brand would pack against the
     icons on the right. Hand the slot back when the chip isn't there. */
  .top-bar:has(.repo-chip[hidden]) .afk-brand { margin-right: auto; }
  .afk-brand-word { display: none; }
}
/* The desktop header is the SAME header as index/link — metrics and colors
   copied from theme.css (.site-header/.brand/.wordmark/.icon-toggle) with the
   site tokens scoped locally, so /chat doesn't import theme.css (its global
   rules would fight the vendored chat css). Sits on the page backdrop. */
#site-bar {
  display: none;
  flex: none;
  width: 100%;
  background: #1a1a1a;
  --sb-heading: #ededed;
  --sb-muted: #9d9d9d;
  --sb-border: #454545;
  --sb-surface: #252526;
  --sb-faint: #6f6f6f;
  --sb-logo: #ffffff;
}
:root[data-theme="light"] #site-bar {
  background: #fbfbfc;
  --sb-heading: #14171c;
  --sb-muted: #565d67;
  --sb-border: #e2e4e8;
  --sb-surface: #ffffff;
  --sb-faint: #8a909a;
  --sb-logo: #14171c;
}
.site-bar-inner {
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding-block: 1.35rem;
  padding-inline: clamp(1.25rem, 4vw, 2.5rem);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
.site-brand {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  color: var(--sb-heading);
  font-weight: 600;
  text-decoration: none;
}
.site-brand .mark {
  width: 26px; height: 26px; flex: none;
  background-color: var(--sb-logo);
  -webkit-mask: url(/logo.svg) center / contain no-repeat;
  mask: url(/logo.svg) center / contain no-repeat;
}
.site-brand .wordmark { font-size: 1.0625rem; letter-spacing: -0.01em; }
.site-brand .wordmark b { font-weight: 600; }
.site-brand .wordmark .dim { color: var(--sb-muted); font-weight: 500; }
.site-actions { display: inline-flex; align-items: center; gap: 0.6rem; }
.icon-toggle {
  width: 38px;
  height: 38px;
  display: inline-grid;
  place-items: center;
  padding: 0;
  border: 1px solid var(--sb-border);
  border-radius: 9px;
  background: var(--sb-surface);
  color: var(--sb-muted);
  cursor: pointer;
  transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
}
.icon-toggle:hover { color: var(--sb-heading); border-color: var(--sb-faint); }
.icon-toggle svg { width: 17px; height: 17px; display: block; }
:root[data-theme="dark"] .i-sun { display: block; }

@media (min-width: 900px) {
  /* #app stays a column: the rail and the chat sit side by side in #app-body
     beneath it. On phones both wrappers are display:contents and the rail is a
     fixed-position drawer, so that single-column flow is untouched. */
  #app-body {
    display: flex;
    flex: 1 1 auto;
    flex-direction: row;
    min-height: 0;
  }
  /* Full bleed, so the rail sits against the window edge instead of floating in
     a centred card. The reading measure does the capping now (#messages pads
     itself to 800px), which is what the outer max-width used to be for — keeping
     both just moved the whole app inward and wasted the margins.
     WITHOUT a rail there is nothing to anchor a full-width layout and the chat
     would be one very wide column, so the legacy path keeps the centred 1120px
     it has always had. Same capability latch as everything else here. */
  body.has-rail #app { max-width: none; }
  #chat-column {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  /* Below the conversation header: transcript+composer on the left, the docked
     file panel on the right. This is what puts the header ABOVE the panel
     rather than beside it — the desktop's shape, where the top bar spans the
     full width and the panel starts under it. */

    display: flex;
    flex: 1 1 auto;
    flex-direction: row;
    min-width: 0;
    min-height: 0;
  }
  #chat-stack {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  /* Third column, after the chat. `flex: 0 0 auto` so it takes exactly what the
     panel inside it asks for and nothing when it is empty — the chat keeps the
     rest. `min-width: 0` for the same reason the rail needs it: a flex item's
     default min-width is its content minimum, and one long file name would
     otherwise push the panel wider than it was dragged to. */

    display: flex;
    flex: 0 0 auto;
    min-width: 0;
    min-height: 0;
  }
  /* Docked, not a drawer — undo every off-canvas rule from the base block.
     `min-width: 0` is load-bearing, not tidiness: a flex item defaults to
     min-width:auto, which is its CONTENT minimum unless the item itself scrolls.
     The scroller moved inside (so the brand and account rows could stay fixed),
     which handed the aside back an auto minimum — and one long project name then
     pushed a 272px rail out to ~475px. The declared width only means anything
     with this. */

     restored from localStorage at boot). It has to be threaded through the
     flex-basis HERE as well as chat.css's `width`, because a flex-basis other
     than `auto` is what actually sizes a flex item — leaving 256px hardcoded
     would make every drag a no-op on the browser client while working fine on
     the desktop. */
  /* `body #projects-rail`, matching the base block it undoes. A media query
     adds NO specificity, so this only wins by being a later rule of equal
     weight — the moment the base block needed `body ` to outrank chat.css,
     this one needed it too or the desktop rail would stay off-canvas. */
  body #projects-rail {
    position: static;
    display: none;
    flex: 0 0 var(--rail-width, 256px);
    width: auto;
    min-width: 0;
    visibility: visible;
    transform: none;
    transition: none;
    box-shadow: none;
  }
  body.has-rail #projects-rail { display: flex; }
  body.rail-collapsed #projects-rail { display: none; }
  /* The handle comes back with the edge. The base block hides it because a
     drawer slides OVER the conversation and has nothing to pull; docked, the
     rail has a real edge and the same drag the desktop app has. A media query
     adds no specificity, so this has to repeat the id-weight selector that hid
     it (1-1-1) and win on source order — and the collapsed rule needs the same
     weight, or it would lose to the line above it instead of to chat.css's
     0-2-1 version. */
  body.has-rail #rail-resizer { display: block; }
  body.rail-collapsed #rail-resizer { display: none; }
  #rail-scrim { display: none; }
  /* The rail carries the brand here, so the site header would be a second one.
     It comes back only where there is no rail at all. */
  body.has-rail #site-bar { display: none; }
  /* The drawer handle is only needed once the rail is gone. History and New
     stay: they are this conversation's controls, in this project, and the
     rail's per-project + is a different act — it moves the whole tab. */
  body.has-rail:not(.rail-collapsed) #rail-open { display: none; }
  body.has-rail #session-head { min-height: 50px; padding-inline: 10px; }

  #site-bar { display: flex; }
  .top-bar .afk-brand { display: none; }
  #theme-btn { display: none; }
  body.has-rail #repo-btn { display: none; }

  /* Desktop header = ONE app-chrome band, not two floating bars. The brand
     row (#site-bar) and the vendored .top-bar (history/new) share the column
     surface; a single full-width hairline AFTER .top-bar terminates the whole
     header and continues the column's side-border frame. Compact 0.625rem
     padding kills the marketing-header feel. (Synthesized with a Codex
     consult; scroll-shadow deliberately rejected — the header sits outside
     the #messages scroller, so a shadow would fall on the wrong layer.) */
  #site-bar { background: var(--vscode-sideBar-background); }
  .site-bar-inner { padding-block: 0.625rem; }
  #site-bar .icon-toggle { width: 34px; height: 34px; border-radius: 7px; }
  /* #app-prefixed to outrank the vendored `.top-bar { border-bottom }` (this
     style block loads BEFORE the vendored sheet, so equal specificity would
     lose to it — and the vendored column-width border rendering alongside the
     divider below was the doubled line). */
  #app .top-bar {
    position: relative;
    /* Keep header popovers above positioned composer descendants (the textarea
       itself is z-index:1). A tie only becomes visible when zoom makes the
       dropdown and composer overlap: later composer content then wins paint
       order and intercepts clicks meant for repository rows. */
    z-index: 2;
    isolation: isolate;
    gap: 2px;
    padding: 2px clamp(1.25rem, 4vw, 2.5rem);
    border-bottom: 0;
    background: transparent;
  }
  /* .top-bar is width-clamped by #app; its surface + terminal divider span
     the viewport. CSS viewport units ignore an ancestor's `zoom`, so divide
     out --chat-zoom before the body scales this box back to the real width
     (body overflow:hidden clips it, with no horizontal scroll). */
  #app .top-bar::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset-block: 0;
    left: 50%;
    width: calc(100vw / var(--chat-zoom, 1));
    transform: translateX(-50%);
    background: var(--vscode-sideBar-background);
    border-bottom: 1px solid var(--vscode-panel-border);
    pointer-events: none;
  }
  /* No hairline above .top-bar. It earned one while the bar sat BESIDE the rail
     and read as a floating strip; now that the bar spans the app again it is
     back in one band with #site-bar, and a rule between them would split the
     header into the two floating bars that band exists to avoid. */
}

          // "open newest session" bridge. A real repo-row click clears the
          // remembered identity before posting selectRepo, so it still arms.

            armIdentityFailTimer();
            notePendingResumeReplay();
          }
        } else if (disposition === "abandon-and-send") {
          abandonIdentityRestore("you chose a different repository or conversation.");
          if (m && (m.type === "resumeSession" || m.type === "selectRepo")) {
            ensureHostHasTabToken(ws);
          }
          ws.send(s);
        } else {
          // The renderer awaits these (30s). Persist is wrong (not user work);
          // drop leaves it hanging. Hold until restore ends.
          if (isReadOnlyFileRequest(m) && !identityRestoreComplete) {
            holdReadOnlyFileRequest(s, m);
          } else {
            persistOutboxMessage(s, m, authored);
          }
        }
      },
      getState: function () { return saved; },
      setState: function (s) { saved = s; return s; },
    };
  };
})();

#link-onboarding button:focus-visible { outline: 2px solid var(--vscode-focusBorder); outline-offset: 2px; }
#link-onboarding .link-onboarding-close {

  top: 6px;
  right: 6px;

  min-height: 36px;

/* Reconnect: a light veil over the old content while the snapshot replays
   under it — no visible clear/rebuild, no jump. Non-blocking on purpose.
   Shown while the transcript has no conversation content; a painted
   conversation uses #reconnecting-indicator instead. Follows the
   transcript for the whole reconnect, not only at the start. */
.auth-overlay.reconnecting {
  background: rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  pointer-events: none;
}
/* Quiet status while a painted conversation reconnects. Same muted type as
   Grokking / Clauding. Out of flow, in the existing resting gap above the
   composer (#messages padding-bottom), so showing or hiding it cannot
   resize the transcript. A flex row here is what caused the jump. Vertical
   padding that would grow the box into the last line is omitted — covering
   that line is worse than the jump this exists to prevent. pointer-events
   none: a tap here is for the composer or the last line, not this. */
#reconnecting-indicator {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
  box-sizing: border-box;
  pointer-events: none;
  color: var(--vscode-descriptionForeground);
  font-size: 13px;
  line-height: 1.4;
  padding: 0 16px;
  user-select: none;
}
/* ---- EXPERIMENT: edge scroll-fade (remote only) ---------------------------
   The oldest/newest visible lines dissolve into the header / composer instead
   of hard-clipping. Done with two overlay gradients that are SIBLINGS of the
   scroller (not a mask on it) — a mask fades or clips the scrollbar; these
   don't touch it. Each overlay's opacity is driven by scroll position (set in
   the shim): 0 at its own extreme (pinned to the top → no top fade; pinned to
   the bottom → no bottom fade), ramping in as you scroll away. The fade handles
   the scroll dissolve; a small resting gap (padding on #messages) keeps the
   first/last message off the header/composer — it scrolls with the content, so
   it doesn't shrink the mid-scroll reading area. Remove the wrap/overlays +
   these rules to revert. */
#messages-wrap {
  position: relative;
  /* The fades are decorative layers over transcript content, never app chrome.
     Contain their internal z-indexes so even a high fade layer cannot escape
     above header/composer popovers or other interactive UI. */
  z-index: 0;
  isolation: isolate;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
#messages { padding-top: 14px; padding-bottom: 14px; }
/* The bottom fade completes at the messages' bottom, which sat 8px (the
   composer's top padding) above the input box — a dead strip between the
   gradient and the input. Drop that padding so the gradient reaches the input,
   the way the top fade reaches the header. */
.composer { padding-top: 0; }
.msg-fade {
  position: absolute;
  left: 0;
  right: 8px;            /* clear the 8px ::-webkit-scrollbar so it stays crisp */
  height: 18px;
  z-index: 4;
  pointer-events: none;
}
.msg-fade-top {
  top: 0;
  background: linear-gradient(to bottom, var(--vscode-sideBar-background), transparent);
  opacity: var(--fade-top-op, 0);
}
.msg-fade-bot {
  bottom: 0;
  background: linear-gradient(to top, var(--vscode-sideBar-background), transparent);
  opacity: var(--fade-bot-op, 0);
}
/* ---- Remote UI tweaks -----------------------------------------------------
   After the mobile media block on purpose so these win source order. */
.mic-btn[hidden] { display: none; }
textarea#input,
.input-highlight { padding-right: 8px; }
/* Effort dots read small beside the enlarged remote gear icons — grow the inner
   dot (the 36px hit-area from the mobile block is unchanged). */
.effort-dot::before { width: 13px; height: 13px; border-width: 2px; }
/* The context popover (under the donut) grew as wide as its content — cap it. */
#context-popover { max-width: 300px; }
/* Media action icons on TOUCH: reveal on tap, not permanently. The vendored
   @media(hover:none) pins them visible (no hover to reveal them); here we hide
   by default and show only the tapped media's overlay — .show-actions is
   toggled by the shim. Hover-capable remotes keep the vendored hover behavior. */
@media (hover: none) {
  /* Hide by default. The :hover / :focus-within variants are here because the
     vendored rules that reveal on hover/focus are (0,3,0) and a tap leaves a
     STICKY :hover on the tapped media — without matching that specificity the
     overlay never hides again. Only .show-actions (toggled by the shim) reveals. */
  .generated-image .generated-media-actions,
  .generated-image:hover .generated-media-actions,
  .math-export .expr-actions,
  .math-export:hover .expr-actions,
  .math-export .expr-actions:focus-within,
  .mermaid-block[data-mermaid-state="done"] .expr-actions,
  .mermaid-block[data-mermaid-state="done"]:hover .expr-actions,
  .mermaid-block[data-mermaid-state="done"] .expr-actions:focus-within { opacity: 0; pointer-events: none; }
  .generated-image.show-actions .generated-media-actions,
  .math-export.show-actions .expr-actions,
  .mermaid-block.show-actions .expr-actions { opacity: 1; pointer-events: auto; }
}
/* The identity-restore veil: body.identity-restoring is set for the whole
   restore so chat.js can hold a pending-clear. The visual veil —
   body.identity-restore-veil — is cold-restore only (empty transcript at
   handshake start) and stays up for the whole replay, not just while empty.
   Lifted once after historyReplay ends and scroll is applied, or on
   finish/abandon so a failed restore cannot leave a hidden transcript.
   pointer-events none — the composer underneath stays usable. */
body.identity-restore-veil #messages { visibility: hidden; }
/* Errors punch through the veil (visibility, unlike display, lets a
   descendant reassert itself): the delay notice, a refusal, offline text —
   the user must see those mid-restore. Only ordinary transcript paint hides. */
body.identity-restore-veil #messages .msg.error { visibility: visible; }
/* The top bar's session name is the same intermediate paint — it read
   "New session" for the restore window after the transcript was already
   veiled (owner, 2026-08-15). Same veil, same lift. */
body.identity-restore-veil #session-head-title { visibility: hidden; }
#identity-restoring-note {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 5;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  color: var(--vscode-descriptionForeground);
  font-size: 13px;
  /* This sits over live transcript text, so the label needs to separate from
     whatever is behind it. A halo rather than a card: stacked shadows in the
     widget background follow the glyph shapes, so there is no box to size or
     position and no layout of any kind. `--vscode-editorWidget-background` is
     defined for both themes above, so it radiates dark on dark and light on
     light without a second rule. Deliberately NOT backdrop-filter: that is a
     compositing layer, and it would appear at the exact moment a phone is
     already painting a restored transcript. */
  text-shadow:
    0 0 4px var(--vscode-editorWidget-background),
    0 0 8px var(--vscode-editorWidget-background),
    0 0 16px var(--vscode-editorWidget-background);
}
body.identity-restore-veil #identity-restoring-note { display: flex; }

/* Message actions (Copy + timestamp) need NO touch rule here anymore: the
   vendored chat.css rests them dimmed (0.4) and tappable on every surface —

   A footer the extension hid mid-turn still carries [hidden] -> display:none

   gesture above stays for MEDIA overlays only. */
</style>
